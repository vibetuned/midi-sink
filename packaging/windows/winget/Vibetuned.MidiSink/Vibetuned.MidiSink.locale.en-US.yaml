ShortDescription: Suminagashi ink-marbling visualizer and MPE instrument driven by expressive MIDI
Description: |-
  midi-sink turns expressive MIDI into suminagashi (Japanese ink marbling):
  every note is an ink drop on water, pressure feeds it, bends drag it,
  controllers comb and swirl the bath. Works with MPE controllers (ROLI,
  Osmose), wind controllers, and any classic keyboard; mouse gestures marble
  without any MIDI at all. Prints of the marbled sheet export as PNG.
