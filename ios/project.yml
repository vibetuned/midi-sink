# midi-sink iOS shell (PROJECT_SPEC.md §5.4) — xcodegen manifest.
# Regenerate the Xcode project with:  cd ios && xcodegen
# The app links the CMake-built static core:
#   cmake -B build-ios -G Ninja -DCMAKE_SYSTEM_NAME=iOS \
#         -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_OSX_ARCHITECTURES=arm64 \
#         -DBUILD_TESTING=OFF && cmake --build build-ios
# No Objective-C wrapper: Swift imports the pure-C ABI directly through
# core/include/module.modulemap (`import SumiCore`).
name: midi-sink-ios
options:
  bundleIdPrefix: com.vibetuned
  deploymentTarget:
    iOS: "16.0"
  # Stamps LastUpgradeCheck so Xcode stops offering "update to recommended
  # settings" on every regeneration; the recommended settings themselves are
  # applied below (the project file is generated and gitignored — anything
  # changed inside Xcode is lost, so it must live here).
  xcodeVersion: "26.6"
# Project-level settings (Xcode's recommendation: the team is inherited by the
# targets rather than set per target).
settings:
  base:
    DEVELOPMENT_TEAM: 47D2CT68R2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  midi-sink:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources        # Assets.xcassets (AppIcon, generated by tools/gen_icons.py)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibetuned.midi-sink
        # Version from the git tag, never hand-edited (Phase 5 working rule;
        # DECISIONS_4 #37): ios/prepare_release.sh exports these before
        # running xcodegen. MARKETING_VERSION must be numeric X.Y.Z for App
        # Store Connect (an RC tag's "-rc.N" cannot appear in it — it lives in
        # SumiBuildDescribe and the build number tells RCs apart).
        MARKETING_VERSION: ${MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../core/include $(SRCROOT)/../hostmpe/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../build-ios/core $(SRCROOT)/../build-ios/hostmpe"
        # -lc++: the app itself is pure Swift, so Xcode won't add the C++
        # runtime libsumi's (exception-free, RTTI-free) code still needs for
        # operator new/delete.
        OTHER_LDFLAGS: "-lsumi -lhostmpe -lc++"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreAudioKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The full `git describe` (tag, or tag-N-gSHA-dirty) for About — the
        # desktop harness carries the same key in its Info.plist (#3).
        SumiBuildDescribe: ${SUMI_BUILD_DESCRIBE}
        # No custom cryptography (CoreMIDI, Bluetooth, RTP-MIDI only): answers
        # App Store Connect's export-compliance question once, so every
        # TestFlight upload skips the prompt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        # REQUIRED for MIDISourceCreate: iOS returns kMIDINotPermitted
        # (-10844) when an app without the audio background mode tries to
        # create a virtual MIDI endpoint. Without this the play surface has
        # no outbound virtual source at all (Step 17, DECISIONS_3 #24).
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSBluetoothAlwaysUsageDescription: >-
          Bluetooth is used to pair Bluetooth MIDI instruments
          (e.g. a ROLI Piano) that paint on the canvas, and to stream the
          play surface's MIDI to other devices.
        # Step 17: the MIDI Network Session (rtpMIDI) needs local-network
        # access; without these keys iOS silently blocks the session.
        NSLocalNetworkUsageDescription: >-
          The MIDI network session streams the play surface to DAWs on your
          local network.
        NSBonjourServices:
          - _apple-midi._udp
