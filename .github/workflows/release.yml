# midi-sink release SPINE (Phase 5 §3, ROADMAP_4 Step 24; DECISIONS_4 #10–#13).
#
# One tag-triggered workflow builds the CI-released platforms. THIS FILE IS THE SPINE:
# version from the tag, the pre-package gates on all three desktop runners,
# CHANGELOG -> release notes, and the draft-release scaffolding. It contains
# ZERO platform lanes — each CI lane step (25 web, 27 macOS, 29 Windows,
# 30 Linux) adds exactly one job, following the LANE INTERFACE below. iOS and
# Android are manual procedures (28, 31). Humans publish the draft; CI stops
# at "uploaded" (working rule).
#
# Trigger:
#   * push a tag:   git tag v1.0.0 && git push origin v1.0.0
#   * dry run:      Actions -> release -> Run workflow (dry_run = true)
#                   -> gates run on all runners, a versioned notes draft is
#                      produced as a run artifact, NOTHING is uploaded to a
#                      release or a store. Lanes must honour dry_run too.
#
# ============================ LANE INTERFACE ================================
# The CI lanes are EXACTLY FOUR: web (Step 25), macos (27), windows (29),
# linux (30). iOS and Android are MANUAL procedures by the author's choice
# (Steps 28/31: Xcode archive -> TestFlight, Android Studio bundle -> Play
# internal, walked from RELEASING.md against a tagged checkout with the
# CI-injected version); they have NO lane job here — push CI keeps them to
# build-only compile checks so a tag never surprises the archive.
#
# A lane is ONE job added below the `gates` job. Contract:
#   needs: [version, gates]              # never packages past a red gate
#   guard every UPLOAD (release asset, Pages deploy) with
#       if: needs.version.outputs.dry_run != 'true'
#   version: build with -DSUMI_APP_VERSION=${{ needs.version.outputs.version }}
#       (`sumi_version()` is the ABI version and is NOT the app version)
#   artifact: upload EXACTLY ONE artifact named  dist-<lane>
#       lanes: dist-web  dist-macos  dist-windows  dist-linux
#       containing the release assets, each named
#           midi-sink-<version>-<platform>[-<variant>].<ext>
#       e.g. midi-sink-1.0.0-macos-universal.dmg, midi-sink-1.0.0-windows-x64-setup.exe,
#            midi-sink-1.0.0-windows-x64-portable.zip, midi-sink_1.0.0_amd64.deb,
#            midi-sink-1.0.0-linux-x64.tar.gz, midi-sink-1.0.0-web.tar.gz
#   the `publish` job collects dist-* and attaches them to the DRAFT release;
#   lanes never create releases themselves. Channel bumps (cask, winget, apt)
#   are separate `release: published` workflows (Steps 27/29/30), never part
#   of this file — a draft has no public asset URLs.
# ===========================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to simulate without a tag, e.g. 1.0.0-rc1 (no leading v). Empty = 0.0.0-dry.<run>"
        required: false
        default: ""
      dry_run:
        description: "Dry run: gates + notes only, upload nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write      # web lane: GitHub Pages deploy
  id-token: write   # web lane: Pages OIDC

jobs:
  # -------------------------------------------------------------------------
  # version: the ONE source of the version string (from the tag) and the
  # release notes (from CHANGELOG.md). Everything downstream consumes its
  # outputs; nothing else may invent a version.
  # -------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: derive version + mode
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            dry_run=false
          else
            version="${INPUT_VERSION:-0.0.0-dry.${GITHUB_RUN_NUMBER}}"
            dry_run="${INPUT_DRY:-true}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] || { echo "::error::version '$version' is not X.Y.Z[-pre]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "midi-sink $version (dry_run=$dry_run)"
      - name: release notes from CHANGELOG.md
        env:
          DRY: ${{ steps.v.outputs.dry_run }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          strict=""; [[ "$DRY" == "true" ]] || strict="--strict"
          python3 tools/release_notes.py docs/CHANGELOG.md --version "$VERSION" \
            --commit "$GITHUB_SHA" --out release-notes/notes.md $strict
          echo "----- notes.md -----"; cat release-notes/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/notes.md

  # -------------------------------------------------------------------------
  # gates: nothing is packaged past these. On each desktop runner: build with
  # the injected version, the headless suites (ABI/C11 x2, normalizer/mapper,
  # hostmpe), then the §4.6 cross-backend field regression THROUGH THE REAL
  # RENDERER (Metal / D3D11 / GL) against the committed Metal fixture, with
  # the gate's own negative control (a corrupted fixture must fail).
  # -------------------------------------------------------------------------
  gates:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Tolerances (DECISIONS_4 #35, calibrated on the first real run): the
        # fixture was captured on an Apple GPU, so macOS runners hold the
        # REFERENCE tier (1e-2 / 1e-4). The Windows and Linux runners have no
        # GPU — D3D11 renders on WARP, GL on Mesa llvmpipe — and both software
        # rasterizers land 6.0e-4 mean from the fixture while agreeing with EACH
        # OTHER to 1.8e-5: rounding, not a bug. They run the SECOND tier
        # (2.5e-2 / 1e-3, the one #20 reserved for non-reference hardware). A
        # one-texel shift anywhere is 2e-3 mean and still fails; the negative
        # control (+0.5 block) fails on every tier.
        include:
          - os: macos-latest
            backend: metal
            app: build/desktop/midi-sink.app/Contents/MacOS/midi-sink
            compare: build/tests/field_dump_compare
            max_tol: 1e-2
            mean_tol: 1e-4
          - os: windows-latest
            backend: d3d11
            app: build/desktop/midi-sink.exe
            compare: build/tests/field_dump_compare.exe
            max_tol: 2.5e-2
            mean_tol: 1e-3
          - os: ubuntu-24.04
            backend: gl
            app: build/desktop/midi-sink
            compare: build/tests/field_dump_compare
            max_tol: 2.5e-2
            mean_tol: 1e-3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: linux deps (GLFW/ALSA build deps + Xvfb and Mesa for the GL gate)
        if: matrix.backend == 'gl'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev xorg-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libasound2-dev xvfb mesa-utils libgl1-mesa-dri
      - name: macos deps
        if: matrix.backend == 'metal'
        run: brew install ninja
      - name: windows toolchain (MSVC + Ninja)
        if: matrix.backend == 'd3d11'
        uses: ilammy/msvc-dev-cmd@v1
      - if: matrix.backend == 'd3d11'
        run: choco install ninja --no-progress

      - name: configure (version injected from the tag)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUMI_APP_VERSION=${{ needs.version.outputs.version }}
      - name: build
        run: cmake --build build
      - name: headless suites
        run: ctest --test-dir build --output-on-failure

      - name: version check (About must read the tag)
        shell: bash
        run: |
          out="$(${{ matrix.app }} --version)"; echo "$out"
          [[ "$out" == *"${{ needs.version.outputs.version }}"* ]] || { echo "::error::binary does not carry the injected version"; exit 1; }

      - name: §4.6 field regression gate (${{ matrix.backend }})
        shell: bash
        run: |
          set -euo pipefail
          cmd=(python3 tools/field_gate.py --app "${{ matrix.app }}" --compare "${{ matrix.compare }}"
               --fixture tests/fixtures/field_512_metal.bin --backend "${{ matrix.backend }}" --out gate
               --max-tol "${{ matrix.max_tol }}" --mean-tol "${{ matrix.mean_tol }}")
          if [[ "${{ matrix.backend }}" == "gl" ]]; then
            # No display on the runner: Xvfb + Mesa llvmpipe give GLFW a GL 4.x context.
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" "${cmd[@]}"
          else
            "${cmd[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-${{ matrix.backend }}
          path: gate/
          if-no-files-found: ignore

  # ================== CI LANES ATTACH HERE (Steps 25, 27, 29, 30) ============
  # web (Step 25, below), macos (27), windows (29), linux (30).
  # iOS (28) and Android (31) are manual procedures: no job here, ever.
  # ===========================================================================

  # -------------------------------------------------------------------------
  # web lane (Step 25): the marble-mode wasm build + host page. Artifact
  # dist-web (midi-sink-<version>-web.tar.gz); on a real tag it also deploys
  # to GitHub Pages under /marble/ (the docs site of Step 26 owns the root).
  # -------------------------------------------------------------------------
  web:
    needs: [version, gates]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure (wasm, version injected)
        run: emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUMI_APP_VERSION=${{ needs.version.outputs.version }}
      - name: build
        run: cmake --build build-web
      - name: package dist-web
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          tar -C build-web/web-dist -czf "dist/midi-sink-$v-web.tar.gz" .
          ls -la dist
      # The documentation site (Step 26) owns the Pages root; the marble app is
      # composed next to it under /marble/. Same tag, same job, one deploy —
      # the site can never document a release other than the one it ships with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: build the docs site (SITE_VERSION from the tag)
        working-directory: site
        env:
          SITE_VERSION: ${{ needs.version.outputs.version }}
          PUBLIC_MARBLE_URL: /marble/
        run: |
          npm ci
          npm run build          # prebuild renders CHANGELOG/DECISIONS; postbuild runs the drift check
      - name: compose the Pages tree (docs at /, marble at /marble/)
        run: |
          set -euo pipefail
          mkdir -p pages/marble
          cp -r site/dist/. pages/
          cp -r build-web/web-dist/. pages/marble/
          test -f pages/index.html && test -f pages/privacy/index.html && test -f pages/support/index.html
          test -f pages/marble/sumi.wasm
          du -sh pages
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/
      # Enables GitHub Pages on the repository (source: GitHub Actions) if it
      # is not yet — the one Pages setting a workflow can do itself. The custom
      # domain and its DNS CNAME remain repo-settings / registrar actions.
      - name: configure GitHub Pages
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: pages artifact
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: deploy to GitHub Pages
        if: needs.version.outputs.dry_run != 'true'
        id: deploy
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------------------
  # macos lane (Step 27): universal (arm64 + x86_64) .app -> Developer ID
  # signature with a secure timestamp -> notarized -> STAPLED (the app, then
  # the DMG around it) -> midi-sink-<version>-macos-universal.dmg -> dist-macos.
  # Signing/notarization come from the organization secrets the author's other
  # apps already use (APPLE_CERTIFICATE .p12 base64, APPLE_CERTIFICATE_PASSWORD,
  # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD app-specific, APPLE_TEAM_ID).
  # Without them (a fork) the lane still produces an ad-hoc DMG and says so; on
  # a real tag WITH a certificate, notarization is REQUIRED — an unnotarized
  # DMG is never attached to a release. The cask bump is publish-cask.yml,
  # fired when a human publishes the draft (a draft has no public asset URL).
  # -------------------------------------------------------------------------
  macos:
    needs: [version, gates]
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install ninja

      - name: import the Developer ID certificate into a throwaway keychain
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/release.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: configure (universal, version injected, Developer ID or ad-hoc)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_TESTING=OFF \
            -DSUMI_APP_VERSION=${{ needs.version.outputs.version }} \
            -DSUMI_CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
      - name: build
        run: cmake --build build

      - name: version check (About must read the tag)
        run: |
          out="$(build/desktop/midi-sink.app/Contents/MacOS/midi-sink --version)"; echo "$out"
          [[ "$out" == *"${{ needs.version.outputs.version }}"* ]] || { echo "::error::binary does not carry the injected version"; exit 1; }

      - name: sign, notarize, staple, DMG
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # notary credentials only for a real release: a dry run proves the
          # mechanics without spending a notarization round trip
          NOTARY_APPLE_ID: ${{ needs.version.outputs.dry_run != 'true' && secrets.APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ needs.version.outputs.dry_run != 'true' && secrets.APPLE_PASSWORD || '' }}
          NOTARY_TEAM_ID: ${{ needs.version.outputs.dry_run != 'true' && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_NOTARIZATION: ${{ (needs.version.outputs.dry_run != 'true' && secrets.APPLE_CERTIFICATE != '') && '1' || '0' }}
        run: packaging/macos/release.sh build/desktop/midi-sink.app "${{ needs.version.outputs.version }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/

  # -------------------------------------------------------------------------
  # windows lane (Step 29): Release build -> signed-if-cert-present (unsigned
  # still releases, per the spec — the SmartScreen consequence is documented
  # in the README, not fought) -> Inno Setup per-user installer + portable
  # zip -> dist-windows. The installer script is packaging/windows/
  # midi-sink.iss (ISCC is preinstalled on windows runners). Signing consumes
  # WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD when the
  # author stages them; absent, the step says so and ships unsigned. The
  # winget bump is publish-winget.yml, fired when a human publishes the draft.
  # -------------------------------------------------------------------------
  windows:
    needs: [version, gates]
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install ninja --no-progress

      - name: configure (version injected from the tag)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSUMI_APP_VERSION=${{ needs.version.outputs.version }}
      - name: build
        run: cmake --build build

      - name: version check (About must read the tag)
        shell: bash
        run: |
          out="$(build/desktop/midi-sink.exe --version)"; echo "$out"
          [[ "$out" == *"${{ needs.version.outputs.version }}"* ]] || { echo "::error::binary does not carry the injected version"; exit 1; }

      - name: import the code-signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx

      - name: sign midi-sink.exe (cert present)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          signtool sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\desktop\midi-sink.exe
          signtool verify /pa build\desktop\midi-sink.exe

      - name: package (installer + portable zip)
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = "midi-sink-$env:VERSION-windows-x64-setup"
          iscc /DAppVersion=$env:VERSION /DAppExe=$PWD\build\desktop\midi-sink.exe `
               /DOutDir=$PWD\dist /DOutName=$setup packaging\windows\midi-sink.iss
          # Portable zip: the exe is self-contained (static core, static GLFW).
          $stage = Join-Path $env:RUNNER_TEMP "portable\midi-sink"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\desktop\midi-sink.exe $stage
          Copy-Item LICENSE "$stage\LICENSE.txt"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\midi-sink-$env:VERSION-windows-x64-portable.zip" -Force
          Get-ChildItem dist

      - name: sign the installer (cert present)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          signtool sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\midi-sink-$env:VERSION-windows-x64-setup.exe"
          signtool verify /pa "dist\midi-sink-$env:VERSION-windows-x64-setup.exe"
      - name: unsigned notice (no certificate staged)
        if: env.WINDOWS_CERTIFICATE == ''
        run: echo "::notice::no WINDOWS_CERTIFICATE secret — shipping unsigned (SmartScreen shows 'More info -> Run anyway' once per new version; documented in the README)"

      - name: checksums
        shell: pwsh
        run: Get-ChildItem dist -File | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Out-File -Encoding ascii "$($_.FullName).sha256"; Get-Content "$($_.FullName).sha256" }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

  # -------------------------------------------------------------------------
  # linux lane (Step 30): Release build on ubuntu-22.04 — the oldest LTS the
  # runners offer, so the binary's glibc floor (2.34) reaches every Ubuntu and
  # Debian a user still runs; a 24.04 build would demand glibc 2.38 and refuse
  # to install on 22.04 (the siblings build on 22.04 for the same reason).
  # 22.04's own CMake (3.22) and gcc (11) are too old for this tree, so CMake
  # comes from Kitware's apt repository and gcc-12 from the archive — both
  # verified in a 22.04 container before this job was written (evidence,
  # Step 30). -> CPack DEB from the desktop-integration component
  # (cmake/LinuxPackaging.cmake: package version 0.5.0~rc.N for a pre-release,
  # FILE name per the lane interface) + the bare-binary tarball, the Windows
  # portable zip's sibling -> dist-linux. The package is installed into a
  # clean 22.04 container here, so a wrong Depends line or glibc floor is red
  # before it can be attached. The apt repository is publish-apt.yml, fired
  # when a human publishes the draft (a draft has no public asset URLs).
  # -------------------------------------------------------------------------
  linux:
    needs: [version, gates]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: toolchain (Kitware CMake >= 3.24, gcc-12, GLFW/ALSA build deps, dpkg tooling)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gpg wget
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor \
            | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            | sudo tee /etc/apt/sources.list.d/kitware.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12 libgl1-mesa-dev xorg-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libasound2-dev dpkg-dev lintian desktop-file-utils
          cmake --version | head -1; g++-12 --version | head -1; ldd --version | head -1

      - name: configure (version injected from the tag)
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSUMI_APP_VERSION=${{ needs.version.outputs.version }}
      - name: build
        run: cmake --build build

      - name: version check (About must read the tag)
        run: |
          out="$(build/desktop/midi-sink --version)"; echo "$out"
          [[ "$out" == *"${{ needs.version.outputs.version }}"* ]] || { echo "::error::binary does not carry the injected version"; exit 1; }

      - name: package (.deb via CPack, tarball of the bare binary)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd build && cpack -G DEB)
          mkdir -p dist
          mv "build/midi-sink_${VERSION}_amd64.deb" dist/
          # The tarball is the self-contained binary (static core, GLFW and
          # libremidi) plus the licence. Desktop integration is the deb's job:
          # a .desktop with an absolute Exec is wrong at any prefix a tarball
          # user picks.
          stage="$RUNNER_TEMP/tar/midi-sink-${VERSION}-linux-x64"
          mkdir -p "$stage"
          cp build/desktop/midi-sink LICENSE "$stage/"
          cat > "$stage/README.txt" <<EOF
          midi-sink ${VERSION} - Linux x86-64, glibc >= 2.34

          Run ./midi-sink. Settings live in ~/.config/midi-sink; run with --dev
          for the lab bench. For a menu entry and icon install the .deb (or the
          apt repository at https://midi-sink.vibetuned.com/apt/), or from a
          source tree: cmake --install build --component desktop-integration --prefix ~/.local

          https://midi-sink.vibetuned.com/
          EOF
          tar -C "$RUNNER_TEMP/tar" -czf "dist/midi-sink-${VERSION}-linux-x64.tar.gz" "midi-sink-${VERSION}-linux-x64"
          ls -la dist

      - name: inspect the package (control, contents, desktop entry, lintian)
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          dpkg-deb -f "$deb"
          dpkg-deb -c "$deb" | awk '{print $6}'
          # Exactly the desktop-integration files: a third-party header here
          # means CPack swept a FetchContent dependency in again.
          n=$(dpkg-deb -c "$deb" | awk '{print $6}' | grep -v '/$' | wc -l)
          [[ "$n" -eq 11 ]] || { echo "::error::the deb carries $n files, expected 11"; exit 1; }
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/applications/midi-sink.desktop > "$RUNNER_TEMP/midi-sink.desktop"
          grep -q '^Exec=/usr/bin/midi-sink$' "$RUNNER_TEMP/midi-sink.desktop"
          desktop-file-validate "$RUNNER_TEMP/midi-sink.desktop"
          lintian --no-tag-display-limit "$deb" || echo "::warning::lintian reported tags (see above; informational)"

      - name: install into a clean 22.04 container, run, remove (Depends + glibc floor really resolve)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:22.04 bash -euc '
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/midi-sink_*_amd64.deb >/dev/null
            midi-sink --version
            test -f /usr/share/applications/midi-sink.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/midi-sink.png
            apt-get remove -y -qq midi-sink >/dev/null
            ! test -e /usr/bin/midi-sink'

      - name: checksums
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  # -------------------------------------------------------------------------
  # publish: collect every lane's dist-* artifact and attach it to a DRAFT
  # GitHub release with the changelog notes. Skipped entirely on a dry run.
  # A human publishes the draft; that publication is what fires the channel
  # workflows (cask / winget / apt) in later steps.
  # -------------------------------------------------------------------------
  publish:
    needs: [version, gates, web, macos, windows, linux]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: list release assets
        run: ls -laR dist || echo "(no lane artifacts yet — the spine alone drafts an assetless release)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: midi-sink v${{ needs.version.outputs.version }}
          body_path: release-notes/notes.md
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: dist/**
          fail_on_unmatched_files: false
