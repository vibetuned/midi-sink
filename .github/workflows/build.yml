# Compile + headless-test verification on every push and PR (Phase 5,
# Step 23): the desktop app — including the shared Dear ImGui settings UI —
# must configure, build and pass the GPU-free suites on all three desktop
# OSes. This is NOT the release spine (that is Step 24's tag-triggered
# workflow); it only proves the tree builds where the lane steps will later
# package it. Windows/Linux are verified here, exercised in Steps 29/30.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the tags for the version string

      - name: linux system deps (GLFW + ALSA, per README)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev xorg-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev

      - name: macos deps
        if: startsWith(matrix.os, 'macos')
        run: brew install ninja

      - name: windows toolchain (MSVC + Ninja)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
      - if: startsWith(matrix.os, 'windows')
        run: choco install ninja --no-progress

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build
      - name: headless suites (ABI/C11, normalizer/mapper, hostmpe)
        run: ctest --test-dir build --output-on-failure

      # The bundle must carry a valid (ad-hoc) hardened-runtime signature
      # straight out of the build — the Step-27 lane replaces the identity,
      # not the mechanism.
      - name: macos bundle signature
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --verify --deep --strict --verbose=2 build/desktop/midi-sink.app
          plutil -p build/desktop/midi-sink.app/Contents/Info.plist

  # The wasm module must keep compiling (Phase 5 §5): the WebGPU swapchain TU,
  # the WGSL dialect and the export glue. No browser here — the §4.6 web tier
  # runs in the release lane's evidence and by hand in Chrome.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-web
      - run: ls -la build-web/web-dist && test -f build-web/web-dist/sumi.wasm

  # iOS and Android have NO job here — not even a compile check — by the
  # author's decision (DECISIONS_4 #38): the tablet apps are built and
  # released locally only (Xcode / Android Studio), from a tagged checkout.

  # The documentation site (Phase 5 §6) must keep building: the generated
  # notes pages, every sidebar slug, KaTeX, and the drift check (dead links,
  # no second operator implementation, the frozen store URLs, the gallery
  # manifest). The MIDI chart is re-verified against the byte logs.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: MIDI chart vs byte logs
        run: python3 tools/chart_check.py
