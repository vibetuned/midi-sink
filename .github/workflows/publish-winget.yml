# winget bump (Phase 5 §3, ROADMAP_4 Step 29): when a release is PUBLISHED
# (drafts don't count — the asset URLs must be public), submit the new version
# to microsoft/winget-pkgs so `winget install Vibetuned.MidiSink` tracks
# releases. Shape copied from the sibling battuta/publish-winget.yml.
#
# Two prerequisites, both one-time:
#  - the WINGET_TOKEN secret: a CLASSIC PAT with the public_repo scope
#    (wingetcreate forks microsoft/winget-pkgs and opens the PR as the author);
#  - the package must already exist in winget-pkgs — the FIRST version is
#    submitted by hand (moderation wants a human on the initial PR):
#
#      wingetcreate new https://github.com/vibetuned/midi-sink/releases/download/v<V>/midi-sink-<V>-windows-x64-setup.exe
#
#    with identifier Vibetuned.MidiSink, publisher Vibetuned, license
#    AGPL-3.0-only, and the frozen Step-26 URLs (see the staged manifest in
#    packaging/windows/winget/). Until that PR is merged this workflow detects
#    the missing manifest and skips.
#
# Pre-releases are SKIPPED: winget-pkgs does not accept pre-release versions
# (the cask flow opens a testable PR instead — there is no safe winget
# equivalent, DECISIONS_4 Step 29). An RC's DONE check installs from the
# staged manifest with `winget install --manifest` instead.
name: publish-winget

on:
  release:
    types: [published]

jobs:
  winget:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: submit the version bump
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PRERELEASE -eq "true") {
            Write-Host "$($env:TAG) is a pre-release — winget-pkgs takes releases only; skipping (test RCs with 'winget install --manifest' from packaging/windows/winget/)."
            exit 0
          }
          # First release: the manifest path does not exist yet — skip
          # rather than fail every release until the manual PR is merged.
          gh api repos/microsoft/winget-pkgs/contents/manifests/v/Vibetuned/MidiSink *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Vibetuned.MidiSink is not in winget-pkgs yet — submit the first version manually with 'wingetcreate new' (see this workflow's header)."
            exit 0
          }
          $version = $env:TAG.TrimStart("v")
          $asset = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' |
            Where-Object { $_ -match '-setup\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "no *-setup.exe asset on $env:TAG" }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$asset"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Vibetuned.MidiSink --version $version --urls $url --submit --token $env:WINGET_TOKEN
