# Gradle daemon JVM (Gradle 8.8+ criteria; Android Studio honours it): the
# build needs Java 17-24 for Gradle 8.14 / AGP 8.10 - a JDK 21 is auto-detected
# from ~/.jdks, /usr/lib/jvm or ~/.gradle/jdks (or provisioned when a toolchain
# repository is configured). Current Android Studio bundles a JBR 25, which
# cannot run this Gradle: this file is what keeps Studio and the CLI on 21.
toolchainVersion=21
